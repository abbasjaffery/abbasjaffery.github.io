<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abbas Jaffery</title>
  <meta name="description" content="Personal site of Abbas Jaffery. Work in progress.">
  <style>
    :root {
      --bg: #fafaf9;
      --fg: #1c1917;
      --muted: #78716c;
      --accent: #2563eb;
      --rule: #e7e5e4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141414;
        --fg: #f5f5f4;
        --muted: #a8a29e;
        --accent: #60a5fa;
        --rule: #292524;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: var(--bg);
      color: var(--fg);
      font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    main { max-width: 34rem; width: 100%; }
    h1 { font-size: 2.25rem; line-height: 1.2; margin: 0 0 0.25rem; letter-spacing: -0.02em; }
    .tagline { color: var(--muted); margin: 0 0 1.5rem; }
    p { margin: 0 0 1rem; }
    hr { border: 0; border-top: 1px solid var(--rule); margin: 1.75rem 0; }
    ul { list-style: none; padding: 0; margin: 0; display: flex; gap: 1.25rem; flex-wrap: wrap; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer { color: var(--muted); font-size: 0.875rem; margin-top: 2.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>Abbas Jaffery</h1>
    <p class="tagline">This site is a work in progress.</p>

    <p>Hi, I'm Abbas. This page is a placeholder while I put together something more complete. Check back soon.</p>

    <hr>

    <ul>
      <li><a href="https://github.com/abbasjaffery">GitHub</a></li>
    </ul>

    <footer>&copy; <span id="year">2026</span> Abbas Jaffery</footer>
  </main>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
